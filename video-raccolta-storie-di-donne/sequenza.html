<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Raccolta fondi – sequenza</title>
<style>
/*
  Sequenza per lo schermo del teatro (1920x1080, oppure 1440x1080 con ?ar=43), grafica di "Storie di donne straordinariamente semplici".
  ?parte=0  apertura: la figura della locandina si compone ritaglio per ritaglio, logo, titolo, ospedale;
            poi transizione alla poltrona (l'ultimo fotogramma è il primo della parte 1)
  ?parte=1  la poltrona si reclina (video invertito, scontornato) sullo sfondo dell'evento
  ?parte=3  la poltrona sparisce, ringraziamento, contatore con 8 poltroncine sulla barra, fuochi d'artificio
  ?parte=5  la cifra si riduce e compaiono le 8 poltrone grandi
  Le parti 2 e 4 sono i fermi immagine dell'ultimo fotogramma di 1 e 3.
  Il tempo è pilotato da window.renderAt(secondi) (asincrona: aspetta il fotogramma della poltrona).
*/
@font-face{ font-family:'Inter'; font-weight:600; src:url(assets/fonts/Inter-600.woff2) format('woff2'); }
@font-face{ font-family:'Inter'; font-weight:800; src:url(assets/fonts/Inter-800.woff2) format('woff2'); }
@font-face{ font-family:'Pinyon Script'; font-weight:400; src:url(assets/fonts/PinyonScript-400.woff2) format('woff2'); }

:root{
  --cream:#F0DFCB;
  --burg:#92433E;
  --terra:#C77B6D;
  --char:#413E37;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:var(--W); height:1080px; overflow:hidden; background:var(--cream); }
body{ font-family:'Inter',sans-serif; color:var(--char); }
.stage{ position:absolute; inset:0; overflow:hidden; background:var(--cream); }

.disc{ position:absolute; border-radius:50%; }
.disc.a{ background:var(--terra); width:640px; height:640px; left:-400px; top:-300px; }
.disc.b{ background:#E9D2BA; width:1700px; height:1700px; left:calc(var(--W) / 2 - 850px); top:150px; }

#fx{ position:absolute; inset:0; }

/* poltrona del video */
.chair{ position:absolute; left:0; top:0; transform-origin:50% 100%; z-index:2; }   /* davanti al disco della figura */
.chair img{ position:absolute; display:block; }
.chair .shadow{ position:absolute; border-radius:50%;
  background:radial-gradient(closest-side, rgba(65,62,55,.30), rgba(65,62,55,.12) 60%, rgba(65,62,55,0)); }

.col{ position:absolute; left:0; right:0; top:36px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.logo{ display:block; width:470px; }
.msg{ display:flex; flex-direction:column; align-items:center; transform-origin:50% 50%; }
.script{ font-family:'Pinyon Script',cursive; color:var(--burg); line-height:1.05; white-space:nowrap; font-size:140px; }
.sub{ font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--char); white-space:nowrap; font-size:44px; margin-top:30px; }
.sub .dots{ letter-spacing:.06em; margin-right:-.16em; }
.sub .dots i{ font-style:normal; }

.amount{ font-weight:800; color:var(--burg); line-height:1; white-space:nowrap; letter-spacing:-.02em; margin-top:4px;
  font-feature-settings:'tnum' 1, 'lnum' 1; display:flex; align-items:baseline; justify-content:center; transform-origin:50% 50%; }
.amount .eur{ font-size:.5em; margin-right:.12em; color:var(--terra); letter-spacing:0; }

.meter{ width:var(--meterW); margin-top:20px; }
.bar{ position:relative; height:16px; border-radius:999px; background:rgba(199,123,109,.28); overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--burg); }
.icons{ display:flex; margin-top:14px; }
.icons span{ flex:1; display:flex; justify-content:center; }
.icons img{ height:66px; display:block; transform-origin:50% 100%; }

/* le 8 poltrone grandi: due file da 4, quella dietro sfalsata */
.fleet{ position:absolute; left:0; right:0; top:0; height:1080px; pointer-events:none; }
.fleet img{ position:absolute; display:block; transform-origin:50% 100%; filter:drop-shadow(0 10px 12px rgba(65,62,55,.22)); }

.intro{ position:absolute; inset:0; display:none; z-index:1; }
.intro .fig{ position:absolute; transform-origin:0 0; }
.intro .fig img{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
.intro .right{ position:absolute; top:0; bottom:100px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.intro .tit{ position:relative; }
.intro .tit img{ position:absolute; display:block; }
.intro .osp{ font-weight:600; color:var(--char); text-align:center; line-height:1.3; }
.intro .osp b{ color:var(--burg); font-weight:800; }

.band{ position:absolute; left:0; right:0; bottom:0; height:110px; z-index:3; }
.band svg{ position:absolute; inset:0; width:100%; height:100%; }
</style>
</head>
<body>
<div class="stage">
  <div class="disc b"></div>
  <div class="disc a"></div>
  <canvas id="fx" height="1080"></canvas>

  <div class="chair" id="chair"><div class="shadow" id="shadow"></div><img id="chairImg" alt=""></div>

  <div class="col">
    <img class="logo" id="logo" src="assets/logo_circolo.png" alt="Circolo Carlo Alberto 1886 – Padula">
    <div class="msg" id="msg">
      <div class="script" id="grazie">Grazie a tutti voi</div>
      <div class="sub" id="sub">siamo riusciti a raccogliere<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
    </div>
    <div class="amount" id="amount"><span class="eur">€</span><span id="num">9.320</span></div>
    <div class="meter" id="meter">
      <div class="bar"><i id="fill"></i></div>
      <div class="icons" id="icons"></div>
    </div>
  </div>

  <div class="fleet" id="fleet"></div>

  <div class="intro" id="intro">
    <div class="fig" id="fig"></div>
    <div class="right" id="introRight">
      <img class="logo" id="introLogo" src="assets/logo_circolo.png" alt="Circolo Carlo Alberto 1886 – Padula">
      <div class="tit" id="tit"></div>
      <div class="osp" id="osp">per il Reparto di Oncologia<br>dell'Ospedale <b>“Luigi Curto”</b><br>di Polla</div>
    </div>
  </div>

  <div class="band">
    <svg viewBox="0 0 106 32" preserveAspectRatio="none"><path d="M0 12 C 30 0, 70 0, 106 6 L106 32 L0 32 Z" fill="#92433E"/></svg>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const PARTE = +(params.get('parte') || 3);
const TOTAL = +(params.get('totale') || 11700);
// formato: 16:9 (1920x1080) oppure 4:3 (1440x1080)
const W = params.get('ar') === '43' ? 1440 : 1920, CX = W / 2;
document.documentElement.style.setProperty('--W', W + 'px');
document.documentElement.style.setProperty('--meterW', Math.min(1300, Math.round(W * 0.76)) + 'px');
document.getElementById('fx').width = W;
const N = +(params.get('poltrone') || 10);
const CHAIR = JSON.parse(params.get('sedia') || 'null');   // {dir, frames, fps, box:[x0,y0,x1,y1], foot:[x,y], base:[x0,x1]}

// tempi (secondi) di ciascuna parte
const T = {
  0: { dur: 12.6, band: [0, 0.8], disc: [0.3, 1.3], body: 0.9, hair: 1.5, eye: [3.0, 3.6], leaves: 2.2,
       logo: [2.4, 3.2], tit: [[3.2, 4.4], [4.2, 5.5], [5.3, 6.1]], osp: [6.4, 7.2],
       out: [10.0, 11.1], chairIn: [10.6, 12.2] },
  1: { dur: CHAIR ? CHAIR.frames / CHAIR.fps : 10 },
  3: { dur: 30.7, chairOut: [0, 1.0], colOut: [0, 0.9], morph: [0.2, 1.5], bgIn: [0.7, 1.7],
       logo: [1.4, 2.3], grazie: [1.7, 3.3], sub: [3.1, 3.9], dots: 4.0,
       shrink: [5.5, 6.6], count: [7.0, 27.0], fireworks: 27.05 },   // conteggio: 20 s
  5: { dur: 7, out: [0, 0.8], move: [0.3, 1.5], fleet: 1.1 },
}[PARTE];
const INTRO_SCALE = 1.5;    // testo ingrandito nell'apertura della parte 3
const CHAIR_SCALE = 1.45;   // ingrandimento della poltrona del video (sorgente 1280x720)
const FINAL_SCALE = 0.56;   // cifra ridotta nella parte 5

const fmt = n => n.toLocaleString('it-IT');
const clamp = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = s => ((ax * s + bx) * s + cx) * s;
  const sy = s => ((ay * s + by) * s + cy) * s;
  return x => { let lo = 0, hi = 1, s = x;
    for (let i = 0; i < 40; i++) { s = (lo + hi) / 2; if (sx(s) < x) lo = s; else hi = s; }
    return sy(s); };
}
const countEase = bezier(0.42, 0, 0.12, 1);

const $ = id => document.getElementById(id);
const els = {
  logo: $('logo'), msg: $('msg'), grazie: $('grazie'), sub: $('sub'), dots: [...document.querySelectorAll('.dots i')],
  amount: $('amount'), num: $('num'), meter: $('meter'), fill: $('fill'), icons: $('icons'), fleet: $('fleet'),
  chair: $('chair'), chairImg: $('chairImg'), shadow: $('shadow'), fx: $('fx'),
};

function fadeUp(el, p, dist, extra = '') {
  const e = easeOut(p);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1 - e) * dist}px) ${extra}`;
}
const show = (el, on) => { el.style.opacity = on ? 1 : 0; };

/* ---------- poltroncine sulla barra ---------- */
const iconEls = [];
for (let i = 0; i < N; i++) {
  const s = document.createElement('span'); const im = new Image();
  im.src = 'assets/poltrona_icona.png'; s.appendChild(im); els.icons.appendChild(s); iconEls.push(im);
}
// istante in cui la barra raggiunge ciascuna soglia (i+1)/N
const iconTimes = (() => {
  if (PARTE !== 3) return [];
  const out = []; const [a, b] = T.count;
  for (let i = 1; i <= N; i++) {
    let lo = a, hi = b;
    for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2; if (countEase(seg(m, a, b)) < i / N - 1e-6) lo = m; else hi = m; }
    out.push(hi);
  }
  return out;
})();

/* ---------- le 8 poltrone grandi ---------- */
const fleetEls = [];

/* ---------- fuochi d'artificio (sobri, deterministici) ---------- */
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
const BURSTS = [
  // ai lati, dove non ci sono scritte
  { dt: 0.00, x: W === 1920 ? 175 : 140, y: W === 1920 ? 560 : 390, n: 30, v: 430, cols: ['#92433E', '#C77B6D', '#B8973F'] },
  { dt: 0.35, x: W === 1920 ? 1745 : 1300, y: W === 1920 ? 520 : 370, n: 30, v: 430, cols: ['#C77B6D', '#92433E', '#B8973F'] },
  { dt: 0.75, x: W - 360, y: 200, n: 26, v: 380, cols: ['#B8973F', '#92433E', '#5A5337'] },
  { dt: 1.10, x: W === 1920 ? 380 : 330, y: 250, n: 26, v: 380, cols: ['#B8973F', '#92433E', '#F4EDE3'] },
].map((b, j) => { const r = rng(1234 + j * 97);
  b.parts = Array.from({ length: b.n }, (_, i) => ({
    ang: (i / b.n) * Math.PI * 2 + (r() - .5) * .25, sp: b.v * (0.65 + 0.35 * r()), col: b.cols[i % b.cols.length], size: 4.5 + 2.5 * r() }));
  return b; });
const LIFE = 1.9, DRAG = 2.4, GRAV = 260;
function sparkPos(b, p, a) {
  const d = (1 - Math.exp(-DRAG * a)) / DRAG;
  return [b.x + Math.cos(p.ang) * p.sp * d, b.y + Math.sin(p.ang) * p.sp * d + 0.5 * GRAV * a * a * 0.6];
}
function drawFireworks(t) {
  const c = els.fx.getContext('2d'); c.clearRect(0, 0, W, 1080);
  if (PARTE !== 3) return;
  for (const b of BURSTS) {
    const a = t - (T.fireworks + b.dt);
    if (a < 0 || a > LIFE) continue;
    const fade = Math.pow(1 - a / LIFE, 1.6);
    for (const p of b.parts) {
      c.fillStyle = p.col;
      for (let k = 0; k < 5; k++) {          // scia
        const ak = a - k * 0.035; if (ak < 0) break;
        const [x, y] = sparkPos(b, p, ak);
        c.globalAlpha = fade * (1 - k / 5) * 0.9;
        c.beginPath(); c.arc(x, y, p.size * (1 - k * 0.15), 0, Math.PI * 2); c.fill();
      }
    }
  }
  c.globalAlpha = 1;
}

/* ---------- poltrona del video (fotogrammi RGBA già scontornati) ---------- */
function placeChair() {
  if (!CHAIR) { els.chair.style.display = 'none'; return; }
  const S = FIGL.cs, [x0, y0, x1, y1] = CHAIR.box, [fx, fy] = CHAIR.foot;
  // poltrona a sinistra, al posto del viso; da reclinata la punta del poggiapiedi cade in FIGL.tip
  const ox = FIGL.tip[0] - TIP_SRC[0] * S, oy = FIGL.tip[1] - TIP_SRC[1] * S;
  els.chairFoot = [ox + fx * S, oy + fy * S];
  els.chairImg.style.left = (ox + x0 * S) + 'px'; els.chairImg.style.top = (oy + y0 * S) + 'px';
  els.chairImg.style.width = ((x1 - x0) * S) + 'px'; els.chairImg.style.height = ((y1 - y0) * S) + 'px';
  // ombra morbida sotto la base
  const [b0, b1] = CHAIR.base, [by0, by1] = CHAIR.baseY || [fy - 60, fy];
  const w = (b1 - b0) * S * 1.3, h = (by1 - by0) * S * 1.6;
  Object.assign(els.shadow.style, { left: (ox + (b0 + b1) / 2 * S - w / 2) + 'px', top: (oy + (by0 + by1) / 2 * S - h / 2 + 6) + 'px',
    width: w + 'px', height: h + 'px' });
  els.chair.style.width = W + 'px'; els.chair.style.height = '1000px';
  els.chair.style.transformOrigin = `${els.chairFoot[0]}px ${els.chairFoot[1]}px`;
}
async function setChairFrame(i) {
  const src = `${CHAIR.dir}/${String(i + 1).padStart(4, '0')}.png`;
  if (els.chairImg.dataset.src === src) return;
  els.chairImg.dataset.src = src; els.chairImg.src = src;
  await els.chairImg.decode();
}

/* ---------- layout ---------- */
function fit() {
  els.num.textContent = fmt(TOTAL);
  let size = 100;
  els.amount.style.fontSize = size + 'px';
  size = Math.min(410, size * 0.82 * W / els.amount.getBoundingClientRect().width);
  els.amount.style.fontSize = size.toFixed(1) + 'px';
  const r = els.msg.getBoundingClientRect();
  els.msgDy = 540 - (r.top + r.height / 2);
  const ra = els.amount.getBoundingClientRect();
  els.amountDy = (W === 1920 ? 295 : 312) - (ra.top + ra.height / 2);   // parte 5: la cifra sale verso l'alto
  placeChair();
  buildFleet();
  buildIntro();
}

function buildFleet() {
  if (PARTE !== 5) return;
  const ar = (CHAIR && CHAIR.drittaAR) || 0.95;   // larghezza/altezza di assets/poltrona_dritta.png
  // N poltrone "a sedia" su due file centrate (10 -> 5 + 5)
  const h = W === 1920 ? 285 : 250, w0 = h * ar, cols = Math.ceil(N / 2);
  const step = Math.min(450, (W - 140 - w0) / Math.max(1, cols - 1));
  const rowCx = n => Array.from({ length: n }, (_, i) => CX + (i - (n - 1) / 2) * step);
  const rows = [ { h, bottom: W === 1920 ? 700 : 692, cx: rowCx(cols) }, { h, bottom: W === 1920 ? 985 : 975, cx: rowCx(N - cols) } ];
  let k = 0;
  for (const r of rows) for (const cx of r.cx) {
    const im = new Image(); im.src = 'assets/poltrona_dritta.png';
    const w = r.h * ar;
    Object.assign(im.style, { left: (cx - w / 2) + 'px', top: (r.bottom - r.h) + 'px', height: r.h + 'px', width: w + 'px' });
    im.dataset.k = k++;
    els.fleet.appendChild(im); fleetEls.push(im);
  }
}

/* ---------- stati delle tre parti ---------- */
function stateCounter(t) {
  // parte 3: ritorna i valori del contatore al tempo t
  const sh = easeInOut(seg(t, ...T.shrink));
  els.msg.style.transform = `translateY(${(1 - sh) * els.msgDy}px) scale(${INTRO_SCALE + (1 - INTRO_SCALE) * sh})`;

  const g = seg(t, ...T.grazie), ge = 1 - Math.pow(1 - g, 2);
  els.grazie.style.clipPath = `inset(-30% ${(1 - ge) * 100}% -30% -5%)`;
  els.grazie.style.opacity = g > 0 ? 1 : 0;
  fadeUp(els.sub, seg(t, ...T.sub), 18);
  els.dots.forEach((el, i) => { el.style.opacity = easeOut(seg(t, T.dots + i * 0.35, T.dots + 0.25 + i * 0.35)); });

  fadeUp(els.amount, seg(t, T.shrink[1] - 0.3, T.shrink[1] + 0.4), 21);
  els.meter.style.opacity = easeOut(seg(t, T.shrink[1] - 0.1, T.shrink[1] + 0.5));
  const p = countEase(seg(t, ...T.count));
  els.num.textContent = fmt(Math.round(TOTAL * p));
  els.fill.style.width = (p * 100) + '%';

  iconEls.forEach((im, i) => {
    const a = seg(t, iconTimes[i], iconTimes[i] + 0.45);
    im.style.opacity = clamp(a * 3);
    im.style.transform = `scale(${a > 0 ? backOut(a) : 0})`;
  });

  const a = seg(t, T.count[1], T.count[1] + 0.9);
  const pulse = a > 0 && a < 1 ? Math.sin(a * Math.PI) * 0.06 : 0;
  els.amount.style.transform += ` scale(${1 + pulse})`;
}

/* ---------- parte 0: apertura con la figura della locandina ---------- */
const INTRO = {"figura": {"viewBox": [62.5, 65.30001831054688, 696.5999755859375, 817.3999938964844], "pezzi": [{"file": "figura_01.svg", "classe": "st0", "box": [86.5, 89.30001831054688, 648.5999755859375, 648.5999755859375]}, {"file": "figura_02.svg", "classe": "st12", "box": [283.8000183105469, 371.7999572753906, 350.2265319824219, 419.3999938964844]}, {"file": "figura_03.svg", "classe": "st12", "box": [461.841552734375, 152.6451416015625, 231.71722412109375, 325.59747314453125]}, {"file": "figura_04.svg", "classe": "st6", "box": [338.1999816894531, 153, 309.5999450683594, 397.278076171875]}, {"file": "figura_05.svg", "classe": "st6", "box": [259.1999816894531, 135.80001831054688, 337.2000427246094, 374.45306396484375]}, {"file": "figura_06.svg", "classe": "st16", "box": [317.1934814453125, 561.4000244140625, 201.89031982421875, 297.29998779296875]}, {"file": "figura_07.svg", "classe": "st4", "box": [584.0999755859375, 266.0000305175781, 53.20001220703125, 30.37322998046875]}, {"file": "figura_08.svg", "classe": "st6", "box": [333.5052490234375, 111.9195327758789, 314.29473876953125, 244.88046264648438]}, {"file": "figura_09.svg", "classe": "st16", "box": [534.2000122070312, 566.2000122070312, 123.4351806640625, 239.4906005859375]}, {"file": "figura_10.svg", "classe": "st16", "box": [493.4482421875, 552.2999877929688, 107.852294921875, 267.29998779296875]}, {"file": "figura_11.svg", "classe": "st16", "box": [348.1000061035156, 591.4999389648438, 192.30465698242188, 234.339599609375]}]}, "titolo": [{"file": "titolo_1.svg", "viewBox": [738.7892456054688, 234.10826110839844, 647.8486938476562, 194.33067321777344]}, {"file": "titolo_2.svg", "viewBox": [868.0271606445312, 361.20001220703125, 672.6760864257812, 123.51885986328125]}, {"file": "titolo_3.svg", "viewBox": [1039.5863037109375, 459.40008544921875, 288.766845703125, 146.09991455078125]}]};
// figura grande, tagliata dal bordo sinistro come nella locandina; colonna di destra; poltrona al posto del viso
// ospTop/ospW: riga dell'ospedale, centrata sotto logo e titolo;
// tip: dove va la punta del poggiapiedi da reclinata (nel vuoto tra titolo e ospedale); cs: scala della poltrona
const FIGL = W === 1920
  ? { s: 1.6, cx: 230, neck: 1033, right: [940, 1860], colBottom: 300, logoW: 460, titW: 900, osp: 42, ospTop: 780, ospW: 640,
      tip: [1110, 655], cs: 1.6 }
  : { s: 1.45, cx: 170, neck: 1015, right: [690, 1410], colBottom: 300, logoW: 420, titW: 700, osp: 36, ospTop: 745, ospW: 520,
      tip: [840, 640], cs: 1.3 };
// punta del poggiapiedi nel fotogramma reclinato della sorgente (1280x720) e piedini
const TIP_SRC = [951, 454];
const figEls = [], titEls = [];
function buildIntro() {
  if (![0, 1, 3].includes(PARTE)) return;
  $('intro').style.display = 'block';
  const [vx, vy, vw, vh] = INTRO.figura.viewBox, S = FIGL.s, fig = $('fig');
  // il centro del disco (410.8, 413.6 nel file) va a x = cx; il taglio del collo (y 745) sotto la fascia
  const left = FIGL.cx - (410.8 - vx) * S, top = FIGL.neck - (745 - vy) * S;
  Object.assign(fig.style, { left: left + 'px', top: top + 'px', width: vw * S + 'px', height: vh * S + 'px' });
  INTRO.figura.pezzi.forEach(p => { const im = new Image(); im.src = 'assets/intro/' + p.file; fig.appendChild(im); figEls.push(im); });
  els.figBox = { left, top, S, vx, vy };
  const R = $('introRight'); R.style.left = FIGL.right[0] + 'px'; R.style.width = (FIGL.right[1] - FIGL.right[0]) + 'px';
  $('introLogo').style.width = FIGL.logoW + 'px';
  const ls = INTRO.titolo.map(l => l.viewBox), ux0 = Math.min(...ls.map(v => v[0])), uy0 = Math.min(...ls.map(v => v[1]));
  const ux1 = Math.max(...ls.map(v => v[0] + v[2])), uy1 = Math.max(...ls.map(v => v[1] + v[3])), ts = FIGL.titW / (ux1 - ux0);
  const tit = $('tit'); Object.assign(tit.style, { width: FIGL.titW + 'px', height: (uy1 - uy0) * ts + 'px', margin: '46px 0 52px' });
  INTRO.titolo.forEach(l => { const im = new Image(); im.src = 'assets/intro/' + l.file;
    const [x, y, w, h] = l.viewBox;
    Object.assign(im.style, { left: (x - ux0) * ts + 'px', top: (y - uy0) * ts + 'px', width: w * ts + 'px', height: h * ts + 'px' });
    tit.appendChild(im); titEls.push(im); });
  const osp = $('osp');
  $('intro').appendChild(osp);   // fuori dalla colonna: in basso a destra, accanto al poggiapiedi
  // centrata sullo stesso asse di logo e titolo
  const axis = (FIGL.right[0] + FIGL.right[1]) / 2;
  Object.assign(osp.style, { position: 'absolute', fontSize: FIGL.osp + 'px', left: axis - FIGL.ospW / 2 + 'px', top: FIGL.ospTop + 'px', width: FIGL.ospW + 'px' });
  R.style.bottom = FIGL.colBottom + 'px';
}

// mode: 'apertura' (parte 0), 'fermo' (parte 1: resta il disco con la colonna di destra), 'uscita' (inizio parte 3)
function stateIntro(t, mode) {
  const discA = document.querySelector('.disc.a'), discB = document.querySelector('.disc.b');
  const band = document.querySelector('.band');
  const T0 = mode === 'apertura' ? T : { band: [-2, -1], disc: [-2, -1], body: -9, hair: -9, eye: [-2, -1], leaves: -9,
    logo: [-2, -1], tit: [[-2, -1], [-2, -1], [-2, -1]], osp: [-2, -1], out: [-2, -1] };
  const b = easeOut(seg(t, ...T0.band));
  band.style.transform = `translateY(${(1 - b) * 100}%)`;

  const P = INTRO.figura.pezzi, { left, top, S, vx } = els.figBox;
  const out = easeInOut(seg(t, ...T0.out));          // escono capelli, viso, occhio, foglie
  const morph = mode === 'uscita' ? easeInOut(seg(t, ...T.morph)) : 0;
  figEls.forEach((im, i) => {
    const cls = P[i].classe, [bx, by, bw, bh] = P[i].box;
    im.style.transformOrigin = `${(bx + bw / 2 - vx) * S}px ${(by + bh / 2 - INTRO.figura.viewBox[1]) * S}px`;
    let a = 0, tr = '';
    if (i === 0) {                                   // disco: cresce dal centro
      a = seg(t, ...T0.disc); tr = `scale(${Math.max(0, backOut(a))})`;
    } else if (cls === 'st12') {                     // viso e collo: salgono
      a = seg(t, T0.body + (i - 1) * 0.25, T0.body + (i - 1) * 0.25 + 0.8);
      tr = `translateY(${(1 - easeOut(a)) * 70}px)`;
    } else if (cls === 'st6') {                      // ciocche di capelli: arrivano da sinistra
      const k = { 3: 0, 4: 1, 7: 2 }[i];
      a = seg(t, T0.hair + k * 0.3, T0.hair + k * 0.3 + 0.9);
      tr = `translate(${(1 - easeOut(a)) * -110}px, ${(1 - easeOut(a)) * -30}px) rotate(${(1 - easeOut(a)) * -6}deg)`;
    } else if (cls === 'st4') {                      // occhio
      a = seg(t, ...T0.eye); tr = `scaleY(${0.2 + 0.8 * easeOut(a)})`;
    } else {                                         // foglie: crescono dal basso
      const k = { 5: 0, 8: 1, 9: 2, 10: 3 }[i];
      a = seg(t, T0.leaves + k * 0.22, T0.leaves + k * 0.22 + 0.9);
      tr = `translateY(${(1 - easeOut(a)) * 260}px) rotate(${(1 - easeOut(a)) * (k % 2 ? 10 : -10)}deg)`;
    }
    let op = i === 0 ? (a > 0 ? 1 : 0) : clamp(a * 2.2);
    if (i > 0) {
      if (mode !== 'apertura') op = 0;
      else if (out > 0) {
        const dir = cls === 'st16' ? [0, 220] : cls === 'st6' ? [-200, -40] : [-60, 60];
        tr += ` translate(${dir[0] * out}px, ${dir[1] * out}px)`;
        op *= 1 - out;
      }
    } else if (morph > 0) {                          // parte 3: il disco va nell'angolo in alto a sinistra
      const r = 324.3 * S, cx = left + (410.8 - vx) * S, cy = top + (413.6 - INTRO.figura.viewBox[1]) * S;
      tr = `translate(${(-80 - cx) * morph}px, ${(20 - cy) * morph}px) scale(${1 + (320 / r - 1) * morph})`;
      im.style.transformOrigin = `${(410.8 - vx) * S}px ${(413.6 - INTRO.figura.viewBox[1]) * S}px`;
      op = 1 - seg(t, T.morph[1] - 0.15, T.morph[1]);
    }
    im.style.transform = tr; im.style.opacity = op;
  });

  // colonna di destra (resta durante la poltrona, esce all'inizio del contatore)
  fadeUp($('introLogo'), seg(t, ...T0.logo), 24);
  titEls.forEach((im, k) => {
    const a = easeInOut(seg(t, ...T0.tit[k]));
    im.style.clipPath = `inset(-20% ${(1 - a) * 100}% -20% -2%)`;
  });
  fadeUp($('osp'), seg(t, ...T0.osp), 20);
  const co = mode === 'uscita' ? easeInOut(seg(t, ...T.colOut)) : 0, R = $('introRight');
  R.style.opacity = 1 - co; R.style.transform = `translateX(${co * 80}px)`;
  if (co > 0) { const o = $('osp'); o.style.opacity = 1 - co; o.style.transform = `translateX(${co * 80}px)`; }

  // poltrona e sfondo del contatore
  if (mode === 'apertura') {
    const c = easeOut(seg(t, ...T.chairIn));
    els.chair.style.opacity = c;
    els.chair.style.transform = `translateY(${(1 - c) * 40}px) scale(${0.94 + 0.06 * c})`;
  }
  discA.style.opacity = mode === 'uscita' ? seg(t, T.morph[1] - 0.15, T.morph[1]) : 0;
  discB.style.opacity = mode === 'uscita' ? easeInOut(seg(t, ...T.bgIn)) : 0;
}

window.renderAt = async function (t) {
  if (PARTE === 0) {
    if (CHAIR) await setChairFrame(CHAIR.frames - 1);   // primo fotogramma della parte 1
    [els.logo, els.msg, els.amount, els.meter].forEach(e => show(e, false));
    stateIntro(t, 'apertura');
  } else if (PARTE === 1) {
    // video invertito: si parte dall'ultimo fotogramma della sorgente
    const i = Math.min(CHAIR.frames - 1, Math.floor(t * CHAIR.fps + 1e-6));
    await setChairFrame(CHAIR.frames - 1 - i);
    [els.logo, els.msg, els.amount, els.meter].forEach(e => show(e, false));
    els.chair.style.opacity = 1;
    stateIntro(t, 'fermo');
  } else if (PARTE === 3) {
    if (CHAIR) await setChairFrame(0);
    const o = easeInOut(seg(t, ...T.chairOut));
    els.chair.style.opacity = 1 - o;
    els.chair.style.transform = `translateY(${o * 30}px) scale(${1 - 0.08 * o})`;
    stateIntro(t, 'uscita');
    fadeUp(els.logo, seg(t, ...T.logo), 28);
    show(els.msg, true);
    stateCounter(t);
    drawFireworks(t);
  } else if (PARTE === 5) {
    els.chair.style.display = 'none';
    els.logo.style.opacity = 1;
    els.num.textContent = fmt(TOTAL);
    els.fill.style.width = '100%';
    iconEls.forEach(im => { im.style.opacity = 1; im.style.transform = 'none'; });
    // testo e barra escono, la cifra si riduce e sale
    const o = easeInOut(seg(t, ...T.out));
    els.msg.style.opacity = 1 - o;
    els.msg.style.transform = `translateY(${-20 * o}px)`;
    els.grazie.style.clipPath = 'none';
    els.dots.forEach(el => (el.style.opacity = 1));
    els.meter.style.opacity = 1 - o;
    const m = easeInOut(seg(t, ...T.move));
    els.amount.style.opacity = 1;
    els.amount.style.transform = `translateY(${m * els.amountDy}px) scale(${1 + (FINAL_SCALE - 1) * m})`;
    fleetEls.forEach((im, k) => {
      const order = k;   // prima fila da sinistra a destra, poi la seconda
      const a = seg(t, T.fleet + order * 0.2, T.fleet + order * 0.2 + 0.7);
      im.style.opacity = clamp(a * 2.5);
      im.style.transform = `translateY(${(1 - easeOut(a)) * 50}px) scale(${0.85 + 0.15 * backOut(a)})`;
    });
  }
};

window.ready = document.fonts.ready
  .then(() => Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => (im.onload = im.onerror = r)))))
  .then(() => { fit(); return Promise.all([...document.images].map(im => im.decode().catch(() => 0))); })
  .then(async () => { await renderAt(+(params.get('t') ?? T.dur)); return T; });
</script>
</body>
