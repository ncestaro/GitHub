<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Raccolta fondi – Storie di donne</title>
<style>
/*
  Contatore animato della raccolta fondi, grafica ripresa da
  "Storie di donne straordinariamente semplici" (locandina e brochure).
  Formato scelto con ?f=v (1080x1920, verticale) oppure ?f=h (1920x1080, orizzontale).
  Il tempo è pilotato da window.renderAt(secondi): render.py cattura un fotogramma alla volta.
*/
@font-face{ font-family:'Inter'; font-weight:500; src:url(assets/fonts/Inter-500.woff2) format('woff2'); }
@font-face{ font-family:'Inter'; font-weight:600; src:url(assets/fonts/Inter-600.woff2) format('woff2'); }
@font-face{ font-family:'Inter'; font-weight:700; src:url(assets/fonts/Inter-700.woff2) format('woff2'); }
@font-face{ font-family:'Inter'; font-weight:800; src:url(assets/fonts/Inter-800.woff2) format('woff2'); }
@font-face{ font-family:'Pinyon Script'; font-weight:400; src:url(assets/fonts/PinyonScript-400.woff2) format('woff2'); }

:root{
  --cream:#F0DFCB;
  --paper:#F4EDE3;
  --burg:#92433E;
  --terra:#C77B6D;
  --char:#413E37;
  --olive:#5A5337;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:var(--W); height:var(--H); overflow:hidden; background:var(--cream); }
body{ font-family:'Inter',sans-serif; color:var(--char); }

.stage{ position:absolute; inset:0; overflow:hidden; background:var(--cream); }

/* cerchi decorativi (come il disco terracotta della locandina) */
.disc{ position:absolute; border-radius:50%; }
.disc.a{ background:var(--terra); }
.disc.b{ background:#E9D2BA; }

.col{ position:absolute; left:0; right:0; display:flex; flex-direction:column; align-items:center; text-align:center; }
.logo{ display:block; }
.script{ font-family:'Pinyon Script',cursive; color:var(--burg); line-height:1.05; white-space:nowrap; }
.sub{ font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--char); }

.amount{ font-weight:800; color:var(--burg); line-height:1; white-space:nowrap; letter-spacing:-.02em;
  font-feature-settings:'tnum' 1, 'lnum' 1; display:flex; align-items:baseline; justify-content:center; }
.amount .eur{ font-size:.5em; margin-right:.12em; color:var(--terra); letter-spacing:0; }

.bar{ position:relative; height:var(--barH); border-radius:999px; background:rgba(199,123,109,.28); overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--burg); }

.dedica{ display:flex; align-items:center; gap:.4em; }
.dedica .k{ font-size:var(--kS); letter-spacing:.22em; text-transform:uppercase; font-weight:600; color:var(--terra); }
.dedica .n{ font-family:'Pinyon Script',cursive; color:var(--burg); font-size:var(--nS); line-height:1.1; white-space:nowrap; }

.band{ position:absolute; left:0; right:0; bottom:0; }
.band svg{ position:absolute; inset:0; width:100%; height:100%; }
.band .txt{ position:absolute; left:0; right:0; color:#fff; text-align:center; }
.band small{ display:block; font-weight:500; letter-spacing:.2em; text-transform:uppercase; opacity:.85; }
.band b{ display:block; font-weight:700; line-height:1.3; }

/* ---------- VERTICALE 1080 x 1920 ---------- */
.v{ --W:1080px; --H:1920px; --barH:16px; }
.v .disc.a{ width:800px; height:800px; left:-560px; top:-400px; }
.v .disc.b{ width:1300px; height:1300px; left:-110px; top:520px; }
.v .col{ top:165px; }
.v .logo{ width:470px; }
.v .script{ font-size:150px; margin-top:110px; }
.v .sub{ font-size:36px; margin-top:34px; }
.v .amount{ margin-top:80px; }
.v .bar{ width:760px; margin-top:60px; }
.v .dedica{ flex-direction:column; gap:14px; margin-top:110px; --kS:24px; --nS:84px; }
.v .band{ height:390px; }
.v .band .txt{ bottom:96px; padding:0 90px; }
.v .band small{ font-size:25px; }
.v .band b{ font-size:38px; margin-top:16px; }

/* ---------- ORIZZONTALE 1920 x 1080 ---------- */
.h{ --W:1920px; --H:1080px; --barH:12px; }
.h .disc.a{ width:760px; height:760px; left:-430px; top:-300px; }
.h .disc.b{ width:1500px; height:1500px; left:210px; top:200px; }
.h .col{ top:54px; }
.h .logo{ width:360px; }
.h .script{ font-size:96px; margin-top:22px; }
.h .sub{ font-size:25px; margin-top:12px; }
.h .amount{ margin-top:14px; }
.h .bar{ width:900px; margin-top:22px; }
.h .dedica{ gap:22px; margin-top:20px; --kS:18px; --nS:54px; }
.h .band{ height:230px; }
.h .band .txt{ bottom:48px; padding:0 200px; }
.h .band small{ font-size:19px; }
.h .band b{ font-size:30px; margin-top:10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="disc b"></div>
  <div class="disc a"></div>

  <div class="col">
    <img class="logo" src="assets/logo_circolo.png" alt="Circolo Carlo Alberto 1886 – Padula">
    <div class="script" id="grazie">Grazie a tutti voi</div>
    <div class="sub" id="sub">siamo riusciti a raccogliere</div>
    <div class="amount" id="amount"><span class="eur">€</span><span id="num">9.320</span></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="dedica" id="dedica"><span class="k">In ricordo della Presidente</span><span class="n">Rosanna Bove Ferrigno</span></div>
  </div>

  <div class="band" id="band">
    <svg viewBox="0 0 106 32" preserveAspectRatio="none"><path d="M0 12 C 30 0, 70 0, 106 6 L106 32 L0 32 Z" fill="#92433E"/></svg>
    <div class="txt">
      <small>Storie di donne straordinariamente semplici</small>
      <b>Interamente devoluti al Reparto di Oncologia<br>dell'Ospedale “L. Curto” di Polla</b>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const FMT = params.get('f') === 'h' ? 'h' : 'v';
const TOTAL = +(params.get('totale') || 9320);
document.documentElement.className = FMT;

// tempi (secondi)
const T = {
  dur: 15,
  countStart: 2.4,
  countEnd: 11.2,
};

const fmt = n => n.toLocaleString('it-IT');   // 9.320
const clamp = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);

// cubic-bezier(x1,y1,x2,y2): parte piano, accelera, poi rallenta a lungo sul finale
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = s => ((ax * s + bx) * s + cx) * s;
  const sy = s => ((ay * s + by) * s + cy) * s;
  return x => {
    let lo = 0, hi = 1, s = x;
    for (let i = 0; i < 40; i++) { s = (lo + hi) / 2; if (sx(s) < x) lo = s; else hi = s; }
    return sy(s);
  };
}
const countEase = bezier(0.42, 0, 0.12, 1);

const $ = id => document.getElementById(id);
const els = {
  logo: document.querySelector('.logo'),
  grazie: $('grazie'), sub: $('sub'), amount: $('amount'), num: $('num'),
  bar: $('bar'), dedica: $('dedica'), fill: $('fill'), band: $('band'),
  discA: document.querySelector('.disc.a'), discB: document.querySelector('.disc.b'),
};

// adatta la cifra finale alla larghezza dello schermo
function fit() {
  els.num.textContent = fmt(TOTAL);
  const target = (FMT === 'v' ? 0.92 : 0.66) * window.innerWidth;
  let size = 100;
  els.amount.style.fontSize = size + 'px';
  size = size * target / els.amount.getBoundingClientRect().width;
  if (FMT === 'h') size = Math.min(size, 280);
  els.amount.style.fontSize = size.toFixed(1) + 'px';
}

function fadeUp(el, p, dist) {
  const e = easeOut(p);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1 - e) * dist}px)`;
}

window.renderAt = function (t) {
  const k = FMT === 'v' ? 1 : 0.7;

  // sfondo: i dischi entrano lentamente
  const d = easeOut(seg(t, 0, 2.2));
  els.discA.style.transform = `translate(${(1 - d) * -120}px, ${(1 - d) * -80}px) scale(${0.9 + 0.1 * d})`;
  els.discA.style.opacity = d;
  els.discB.style.opacity = d;
  // lieve deriva continua dei dischi
  els.discB.style.transform = `translateY(${Math.sin(t * 0.35) * 14 * k}px)`;

  // fascia bordeaux sale dal basso
  const b = easeOut(seg(t, 0.3, 1.5));
  els.band.style.transform = `translateY(${(1 - b) * 100}%)`;

  fadeUp(els.logo, seg(t, 0.4, 1.4), 40 * k);

  // "Grazie a tutti voi": rivelato da sinistra come una scrittura a mano
  const g = seg(t, 0.9, 2.3);
  const ge = 1 - Math.pow(1 - g, 2);
  els.grazie.style.clipPath = `inset(-20% ${(1 - ge) * 100}% -20% 0)`;
  els.grazie.style.opacity = g > 0 ? 1 : 0;

  fadeUp(els.sub, seg(t, 1.6, 2.5), 24 * k);

  // contatore
  fadeUp(els.amount, seg(t, 1.9, 2.6), 30 * k);
  els.bar.style.opacity = easeOut(seg(t, 2.1, 2.7));
  const p = countEase(seg(t, T.countStart, T.countEnd));
  const val = Math.round(TOTAL * p);
  els.num.textContent = fmt(val);
  els.fill.style.width = (p * 100) + '%';

  // arrivo: piccolo "battito" della cifra
  const a = seg(t, T.countEnd, T.countEnd + 0.9);
  const pulse = a > 0 && a < 1 ? Math.sin(a * Math.PI) * 0.06 : 0;
  els.amount.style.transform += ` scale(${1 + pulse})`;

  // dedica finale
  fadeUp(els.dedica, seg(t, T.countEnd + 0.6, T.countEnd + 2.0), 26 * k);
};

window.ready = document.fonts.ready.then(() => {
  const img = els.logo;
  return img.complete ? null : new Promise(r => (img.onload = r));
}).then(() => { fit(); renderAt(+(params.get('t') || T.dur)); return T; });
</script>
</body>
</html>
